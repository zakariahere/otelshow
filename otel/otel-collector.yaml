# Lesson 3: THE SHIFT - the app pushes, nobody scrapes.
# The old scrape pipeline keeps running: migration means coexistence.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: otelshow-app
          scrape_interval: 5s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["app:8080"]
  otlp:                          # one receiver, all three signals
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # explicit: the in-container default is localhost-only
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  resource/env:
    attributes:
      - key: deployment.environment.name
        value: demo
        action: upsert
  batch:
    timeout: 2s

exporters:
  debug:
    verbosity: detailed
  prometheus_remote_write:
    endpoint: http://lgtm:9090/api/v1/write
    tls:
      insecure: true

service:
  pipelines:
    metrics/scrape:              # OLD world, still alive - no debug so it stays quiet
      receivers: [prometheus]
      processors: [memory_limiter, resource/env, batch]
      exporters: [prometheus_remote_write]
    traces:                      # NEW world: raw OTLP - stare at it in the logs
      receivers: [otlp]
      exporters: [debug]
    metrics/otlp:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
