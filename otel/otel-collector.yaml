# Lesson 6: the collector as a platform - connectors + tail sampling.
# Two-stage trace pipeline: span_metrics must see 100% of spans, THEN
# tail_sampling keeps 25% + all errors + all slow. Ordering as architecture.
receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: otelshow-app
          scrape_interval: 5s
          metrics_path: /actuator/prometheus
          static_configs:
            - targets: ["app:8080"]
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

  resource_detection:            # environment self-awareness: os.type, host.name...
    detectors: [env, system]     # ('resourcedetection' is a deprecated alias now)
    override: false

  resource/env:
    attributes:
      - key: deployment.environment.name
        value: demo
        action: upsert

  attributes/team:               # simple key/value surgery on every span/metric/log
    actions:
      - key: team
        value: platform-observability
        action: upsert

  filter/noise:                  # drop before you transform: cheapest span is a dead span
    error_mode: ignore
    trace_conditions:
      # kills the 'GET /actuator/prometheus' spans our own scraper generates every 5s
      - IsMatch(span.attributes["url.path"], "/actuator.*")

  transform/redact:              # compliance without code changes (OTTL)
    error_mode: ignore
    trace_statements:
      # client spans carry url.full, server spans carry url.query - redact both
      - replace_pattern(span.attributes["url.full"], "player=[^&]*", "player=REDACTED")
      - replace_pattern(span.attributes["url.query"], "player=[^&]*", "player=REDACTED")
    log_statements:
      - replace_pattern(log.body, "player \\w+", "player ***")

  batch:
    timeout: 2s

  tail_sampling:                 # decides per WHOLE trace, after it completes
    decision_wait: 5s            # short for the demo; prod default is 30s
    num_traces: 50000
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: baseline
        type: probabilistic
        probabilistic:
          sampling_percentage: 25

connectors:                      # a connector is an exporter AND a receiver: pipelines feeding pipelines
  span_metrics:                  # traces in -> RED metrics out ('spanmetrics' is a deprecated alias)
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s, 5s]
    dimensions:
      - name: http.request.method
      - name: http.response.status_code
    exemplars:
      enabled: true              # each datapoint links back to a real trace
    metrics_flush_interval: 15s
  forward: {}                    # plain glue between the two trace stages below

exporters:
  debug:
    verbosity: normal            # demoted: Grafana is the star of this lesson
  prometheus_remote_write:
    endpoint: http://lgtm:9090/api/v1/write
    tls:
      insecure: true
  otlp_http/tempo:               # ('otlphttp' is a deprecated alias - use otlp_http)
    # Tempo inside lgtm binds OTLP to 127.0.0.1 only, so traces enter through the
    # LGTM box's own embedded collector on 4318 - a collector behind your collector!
    endpoint: http://lgtm:4318
    tls:
      insecure: true
  otlp_http/loki:                # Loki has native OTLP ingest
    endpoint: http://lgtm:3100/otlp
    tls:
      insecure: true
  otlp_http/prometheus:          # Prometheus native OTLP ingest (--web.enable-otlp-receiver)
    endpoint: http://lgtm:9090/api/v1/otlp
    tls:
      insecure: true

service:
  pipelines:
    metrics/scrape:
      receivers: [prometheus]
      processors: [memory_limiter, resource/env, batch]
      exporters: [prometheus_remote_write]
    traces/in:                   # stage 1: enrich + measure EVERY trace
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource/env, attributes/team, filter/noise, transform/redact]
      exporters: [span_metrics, forward]           # RED metrics computed BEFORE sampling
    traces/out:                  # stage 2: sample, then ship the survivors
      receivers: [forward]
      processors: [tail_sampling, batch]
      exporters: [debug, otlp_http/tempo]
    metrics/spanmetrics:         # traces became metrics - no app change needed
      receivers: [span_metrics]
      processors: [batch]
      exporters: [otlp_http/prometheus]
    metrics/otlp:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource/env, attributes/team, batch]
      exporters: [debug, otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource/env, attributes/team, transform/redact, batch]
      exporters: [debug, otlp_http/loki]
