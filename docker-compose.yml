services:
  lgtm:
    image: grafana/otel-lgtm:0.30.2
    ports:
      - "3000:3000"   # Grafana (anonymous admin - just open it)
      - "9090:9090"   # Prometheus UI
    # 4317/4318 deliberately NOT published: from branch 01 the standalone
    # collector owns those host ports - telemetry must go THROUGH it.

  app:
    build: ./app
    ports:
      - "8080:8080"
    environment:
      # THE SHIFT. The agent jar was always in the image - these lines wake it up.
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar"
      OTEL_SERVICE_NAME: otelshow-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=demo,team=platform
      OTEL_METRIC_EXPORT_INTERVAL: "10000"            # 10s -> snappy live demo
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true" # bridge dice.rolls counter to OTLP

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.158.0
    volumes:
      - ./otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (used from branch 03; published now for host-side demos)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - app
      - lgtm
